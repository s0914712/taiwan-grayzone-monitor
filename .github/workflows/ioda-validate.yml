name: IODA 離島監測驗證（手動）

# 一鍵驗證 src/fetch_ioda.py 能不能真的跟 IODA 對上。
#
# 為什麼是手動而不是排程：正式的離島掃描已經掛在 cloudflare-radar.yml 裡（每 2
# 小時跟 Cloudflare Radar 一起跑），這支只是**驗證用**，按了才跑，而且全程
# 不 commit 任何東西，重複按也不會弄髒 repo。
#
# 結果會整理成表格顯示在 run 頁面的 Summary（不用翻 log），
# data/ioda.json 會存成 artifact 供下載。

on:
  workflow_dispatch:
    inputs:
      days:
        description: '抓幾天資料（驗證用 2~7 天就夠，正式跑是 28）'
        required: false
        default: '7'
      dump_raw:
        description: '印出 IODA 的原始回應（形狀對不上時打開）'
        type: boolean
        required: false
        default: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests pytest

      # ── 步驟 1：region 代碼能不能查到 ──────────────────────────────────
      - name: 1️⃣ 解析三個離島的 region 代碼
        id: regions
        run: |
          python - <<'PY' | tee /tmp/step1.txt
          import sys; sys.path.insert(0, 'src')
          import requests
          from fetch_ioda import ISLANDS, resolve_region_code
          s = requests.Session()
          ok = 0
          for spec in ISLANDS:
              code = resolve_region_code(spec['search'], s)
              print(f"{spec['label_zh']:<12} search={spec['search']:<12} → code={code}")
              ok += 1 if code else 0
          print(f"RESULT {ok}/{len(ISLANDS)}")
          PY
          grep -q "RESULT 3/3" /tmp/step1.txt && echo "pass=true" >> "$GITHUB_OUTPUT" || echo "pass=false" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # ── 步驟 2：訊號端點的原始回應長什麼樣 ────────────────────────────
      # 這是唯一沒被驗證過的部分 —— 開發沙箱連不上 IODA，parse_signal_payload
      # 是照文件猜的形狀寫的多層容錯。這一步把真實回應印出來。
      - name: 2️⃣ 訊號端點原始回應（形狀確認）
        if: ${{ inputs.dump_raw }}
        run: |
          python - <<'PY' | tee /tmp/step2.txt
          import sys, json; sys.path.insert(0, 'src')
          import requests
          from datetime import datetime, timedelta, timezone
          from fetch_ioda import IODA_API, _ts
          end = datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
          start = end - timedelta(days=2)
          # 用馬祖（連江 4210）+ 主動探測當樣本
          url = f"{IODA_API}/signals/raw/region/4210"
          r = requests.get(url, params={"from": _ts(start), "until": _ts(end),
                                        "datasource": "ping-slash24"}, timeout=45)
          print("URL   :", r.url)
          print("STATUS:", r.status_code)
          body = r.text
          print("BODY  :", body[:1500])
          print("..." if len(body) > 1500 else "")
          PY
        continue-on-error: true

      # ── 步驟 3：解析器吃不吃得下真實回應 ──────────────────────────────
      - name: 3️⃣ 解析器對真實回應的結果
        id: parse
        run: |
          python - <<'PY' | tee /tmp/step3.txt
          import sys; sys.path.insert(0, 'src')
          import requests
          from datetime import datetime, timedelta, timezone
          from fetch_ioda import DATASOURCES, ISLANDS, fetch_signal, resolve_region_code
          end = datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
          start = end - timedelta(days=2)
          s = requests.Session()
          ok = total = 0
          for spec in ISLANDS:
              code = resolve_region_code(spec['search'], s)
              if not code:
                  continue
              for ds in DATASOURCES:
                  total += 1
                  sig = fetch_signal(code, ds['id'], start, end, s)
                  if sig and sig['timestamps']:
                      n = len(sig['timestamps'])
                      nn = sum(1 for v in sig['values'] if v is not None)
                      print(f"✅ {spec['label_zh']:<12} {ds['id']:<13} {n} 點（非空 {nn}）"
                            f" 首點={sig['timestamps'][0]} 值={sig['values'][0]}")
                      ok += 1
                  else:
                      print(f"❌ {spec['label_zh']:<12} {ds['id']:<13} 解析不出序列")
          print(f"RESULT {ok}/{total}")
          PY
          if grep -qE "RESULT ([1-9][0-9]*)/" /tmp/step3.txt && ! grep -q "RESULT 0/" /tmp/step3.txt; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      # ── 步驟 4：完整跑一次（含船隻關聯）────────────────────────────────
      - name: 4️⃣ 完整執行 fetch_ioda.py
        id: full
        run: |
          python src/fetch_ioda.py --days ${{ inputs.days }} 2>&1 | tee /tmp/step4.txt
          test -f data/ioda.json && echo "pass=true" >> "$GITHUB_OUTPUT" || echo "pass=false" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # ── 步驟 5：單元測試 ──────────────────────────────────────────────
      - name: 5️⃣ 單元測試
        id: tests
        run: |
          # 注意：pytest -q 失敗時的結尾是「1 failed, 43 passed」，也含 passed，
          # 所以不能只 grep passed —— 直接用 exit code 判定
          set +e
          python -m pytest tests/test_fetch_ioda.py tests/test_cloudflare_radar.py -q 2>&1 | tee /tmp/step5.txt
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" = "0" ] && echo "pass=true" >> "$GITHUB_OUTPUT" || echo "pass=false" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # ── 步驟 6：馬祖有沒有 RIPE Atlas 觀測點 ──────────────────────────
      # IODA 對連江縣（4210）三種訊號全部回 data:[[]]，該區被 geolocate 的 /24
      # 太少。若島上有 Atlas probe，就能直接讀它的內建量測當替代訊號。
      - name: 6️⃣ RIPE Atlas 離島觀測點盤點
        id: atlas
        run: |
          python - <<'PY' | tee /tmp/step6.txt
          import sys; sys.path.insert(0, 'src')
          import requests
          from geo_utils import haversine_km
          from fetch_ioda import ISLANDS

          probes, url = [], "https://atlas.ripe.net/api/v2/probes/"
          params = {"country_code": "TW", "status": 1, "page_size": 500,
                    "format": "json"}
          try:
              while url and len(probes) < 2000:
                  r = requests.get(url, params=params, timeout=45)
                  r.raise_for_status()
                  j = r.json()
                  probes.extend(j.get("results") or [])
                  url, params = j.get("next"), None
          except Exception as e:
              print("ATLAS_ERROR", e)

          print(f"台灣在線 probe 總數: {len(probes)}")
          located = 0
          for p in probes:
              geo = (p.get("geometry") or {}).get("coordinates")
              if geo and len(geo) >= 2:
                  p["_lon"], p["_lat"] = geo[0], geo[1]
                  located += 1
          print(f"其中有座標的: {located}")

          hits = 0
          for isl in ISLANDS:
              near = []
              for p in probes:
                  if "_lat" not in p:
                      continue
                  d = haversine_km(isl["lat"], isl["lon"], p["_lat"], p["_lon"])
                  near.append((d, p))
              near.sort(key=lambda x: x[0])
              on_island = [x for x in near if x[0] <= 60]
              hits += len(on_island)
              print(f"\n{isl['label_zh']}（{isl['lat']},{isl['lon']}）")
              if on_island:
                  for d, p in on_island[:5]:
                      print(f"  ✅ {d:6.1f} km  probe {p['id']}  "
                            f"AS{p.get('asn_v4')}  {p.get('address_v4')}")
              else:
                  print("  ❌ 60km 內沒有 probe。最近的三個：")
                  for d, p in near[:3]:
                      print(f"     {d:7.1f} km  probe {p['id']}  AS{p.get('asn_v4')}")
          print(f"\nRESULT on_island_probes={hits}")
          PY
        continue-on-error: true

      # ── 步驟 7：馬祖的 IP 前綴怎麼找（BGP 監測的前置作業）────────────
      # 要監測「馬祖的前綴是否從路由表消失」，得先知道哪些前綴是馬祖的。
      # 三條線索：IODA 自己關聯到的 ASN、馬祖公家機關網域解析到的 IP、
      # 以及該 IP 所屬的 ASN／前綴（並排除 CDN —— 解析到 Cloudflare 就代表
      # 量到的是邊緣節點，不是離島鏈路）。
      - name: 7️⃣ 馬祖 IP 前綴探索
        id: prefix
        run: |
          python - <<'PY' | tee /tmp/step7.txt
          import socket, sys
          import requests

          IODA = "https://api.ioda.inetintel.cc.gatech.edu/v2"
          # 雲端／CDN 的 ASN —— 解析到這些代表網站不在島上
          CDN_ASNS = {13335: "Cloudflare", 16509: "AWS", 15169: "Google",
                      8075: "Microsoft", 20940: "Akamai", 54113: "Fastly",
                      139070: "Google Cloud", 24429: "Alibaba"}

          print("=== 7a. IODA 把哪些實體關聯到連江縣(4210) / 金門(4209) ===")
          for code, name in (("4210", "連江"), ("4209", "金門")):
              for et in ("asn", "region"):
                  try:
                      r = requests.get(f"{IODA}/entities/query",
                                       params={"entityType": et,
                                               "relatedTo": f"region/{code}"},
                                       timeout=45)
                      body = r.text[:400]
                      print(f"  [{name} {code}] relatedTo entityType={et} "
                            f"HTTP {r.status_code}: {body}")
                  except Exception as e:
                      print(f"  [{name}] {et} 查詢失敗: {e}")

          print("\n=== 7b. 馬祖公家機關網域解析 ===")
          DOMAINS = ["www.matsu.gov.tw", "matsu.gov.tw", "www.matsu.edu.tw",
                     "www.matsu-news.gov.tw", "www.matsuhb.gov.tw",
                     "www.mtjh.matsu.edu.tw", "www.nqu.edu.tw"]
          found = []
          for d in DOMAINS:
              try:
                  ip = socket.gethostbyname(d)
                  found.append((d, ip))
                  print(f"  {d:28} → {ip}")
              except Exception as e:
                  print(f"  {d:28} → 解析失敗 ({type(e).__name__})")

          print("\n=== 7c. 這些 IP 屬於哪個 ASN／前綴（是不是 CDN）===")
          for d, ip in found:
              try:
                  r = requests.get("https://stat.ripe.net/data/prefix-overview/data.json",
                                   params={"resource": ip}, timeout=45)
                  data = (r.json() or {}).get("data") or {}
                  pfx = data.get("resource")
                  asns = [a.get("asn") for a in (data.get("asns") or [])]
                  holder = (data.get("asns") or [{}])[0].get("holder", "")
                  tag = ""
                  for a in asns:
                      if a in CDN_ASNS:
                          tag = f"  ⚠️ {CDN_ASNS[a]}（CDN／雲端，不在島上）"
                  print(f"  {d:28} {ip:16} prefix={pfx}  AS{asns}  {holder}{tag}")
              except Exception as e:
                  print(f"  {d:28} {ip:16} RIPEstat 查詢失敗: {e}")
          print("\nRESULT domains_resolved=%d" % len(found))
          PY
        continue-on-error: true

      # ── 步驟 8：那些 IP 到底在不在馬祖島上 ────────────────────────────
      # 7c 已確認：馬祖公家網站掛在 AS4782 GSNET（政府網際服務網，全國 gov.tw
      # 共用）與 AS1659 TANet，沒有任何馬祖專屬前綴 —— 所以 BGP 可見性監測對
      # 馬祖無效。剩下的問題是：這些主機**實體**在不在島上？在的話還能靠 RTT
      # 監測（斷纜→微波備援→延遲飆高）。
      # 判斷方式：反解 PTR（中華電信的路由器命名常含地名）＋ whois 的 netname
      # ＋ TCP traceroute 看最後幾跳。
      #
      # ⚠️ 2026-07 實測結論（已寫進 src/CLAUDE.md，這步保留供日後重驗）：
      #   - whois 是決定性的：GSN 登記在台北市中正區延平南路 143 號；
      #     matsu.edu.tw 屬 TANet 桃園區網（中壢中央大學）。都不在島上。
      #   - 8c 的 traceroute 在 GitHub runner 上**完全無效** —— 四個目標
      #     （含對照組）全部 20 跳都是 `*`，Azure 擋掉回程的 ICMP
      #     time-exceeded。留著只是為了讓人自己看到這個限制，別期待有輸出。
      - name: 8️⃣ 候選主機是否實體位於馬祖
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq traceroute
          python - <<'PY' | tee /tmp/step8.txt
          import socket, subprocess
          import requests

          # 馬祖候選 + 對照組（台北的 GSN 與 TANet，用來看路徑差異）
          TARGETS = [
              ("馬祖縣府 www.matsu.gov.tw", "117.56.181.161"),
              ("馬祖日報",                  "117.56.181.98"),
              ("連江縣教育網 matsu.edu.tw", "163.25.24.25"),
              ("對照：金門大學 nqu.edu.tw",  "120.125.96.159"),
          ]

          print("=== 8a. 反解 PTR（中華電信路由器/主機命名常含地名）===")
          for name, ip in TARGETS:
              try:
                  host = socket.gethostbyaddr(ip)[0]
              except Exception:
                  host = "(無 PTR)"
              print(f"  {name:28} {ip:16} {host}")

          print("\n=== 8b. whois netname / descr（是否登記給連江縣）===")
          for name, ip in TARGETS:
              try:
                  r = requests.get("https://stat.ripe.net/data/whois/data.json",
                                   params={"resource": ip}, timeout=45)
                  recs = ((r.json() or {}).get("data") or {}).get("records") or []
                  keep = []
                  for block in recs:
                      for row in block:
                          k = (row.get("key") or "").lower()
                          if k in ("netname", "descr", "org-name", "country",
                                   "owner", "ownerid"):
                              keep.append(f"{row['key']}={row['value']}")
                  print(f"  {name:28} {' | '.join(keep[:6]) or '(無)'}")
              except Exception as e:
                  print(f"  {name:28} whois 失敗: {e}")

          print("\n=== 8c. TCP traceroute（看最後幾跳的位置）===")
          for name, ip in TARGETS:
              print(f"\n  --- {name} ({ip}) ---")
              try:
                  out = subprocess.run(
                      ["sudo", "traceroute", "-T", "-p", "443", "-w", "2",
                       "-q", "1", "-m", "20", ip],
                      capture_output=True, text=True, timeout=180)
                  print(out.stdout or out.stderr)
              except Exception as e:
                  print(f"  traceroute 失敗: {e}")
          PY
        continue-on-error: true

      # ── 整理成 Summary（不用翻 log）──────────────────────────────────
      - name: 📋 產生結果摘要
        if: always()
        run: |
          {
            echo "## IODA 離島監測驗證結果"
            echo ""
            echo "| 步驟 | 結果 |"
            echo "|---|---|"
            echo "| 1️⃣ region 代碼解析 | ${{ steps.regions.outputs.pass == 'true' && '✅ 三個離島都查到' || '❌ 失敗' }} |"
            echo "| 3️⃣ 訊號序列解析 | ${{ steps.parse.outputs.pass == 'true' && '✅ 解析得出序列' || '❌ 形狀對不上' }} |"
            echo "| 4️⃣ 完整執行 | ${{ steps.full.outputs.pass == 'true' && '✅ 產出 ioda.json' || '❌ 失敗' }} |"
            echo "| 5️⃣ 單元測試 | ${{ steps.tests.outputs.pass == 'true' && '✅ 通過' || '❌ 失敗' }} |"
            echo ""
            echo "### 1️⃣ region 代碼"
            echo '```'; cat /tmp/step1.txt 2>/dev/null || echo "(無)"; echo '```'
            echo "### 3️⃣ 各訊號解析結果"
            echo '```'; cat /tmp/step3.txt 2>/dev/null || echo "(無)"; echo '```'
            echo "### 4️⃣ 完整執行輸出"
            echo '```'; tail -40 /tmp/step4.txt 2>/dev/null || echo "(無)"; echo '```'
            echo "### 6️⃣ RIPE Atlas 離島觀測點（馬祖替代訊號的可行性）"
            echo '```'; cat /tmp/step6.txt 2>/dev/null || echo "(無)"; echo '```'
            echo "### 7️⃣ 馬祖 IP 前綴探索（BGP 監測的前置）"
            echo '```'; cat /tmp/step7.txt 2>/dev/null || echo "(無)"; echo '```'
            echo "### 8️⃣ 候選主機是否實體位於馬祖"
            echo '```'; cat /tmp/step8.txt 2>/dev/null || echo "(無)"; echo '```'
            if [ "${{ steps.parse.outputs.pass }}" != "true" ]; then
              echo "### ⚠️ 訊號形狀對不上 — 原始回應（把這段貼回對話）"
              echo '```json'; sed -n 's/^BODY  ://p' /tmp/step2.txt 2>/dev/null | head -c 3000; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上傳 ioda.json 供下載
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioda-json
          path: data/ioda.json
          if-no-files-found: warn

      # 任一關鍵步驟失敗就讓整個 run 顯示紅燈，一眼看得出來
      - name: 判定整體結果
        if: always()
        run: |
          fail=0
          for s in "${{ steps.regions.outputs.pass }}" "${{ steps.parse.outputs.pass }}" \
                   "${{ steps.full.outputs.pass }}" "${{ steps.tests.outputs.pass }}"; do
            [ "$s" = "true" ] || fail=1
          done
          [ "$fail" = "0" ] && echo "✅ 全部通過" || {
            echo "::error::有步驟未通過 — 詳見本次 run 的 Summary"; exit 1; }
