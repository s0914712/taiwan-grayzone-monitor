name: Update AIS & Identity Tracking (High-Freq)

on:
  schedule:
    # 白天高頻：台灣 08:00-17:00 (UTC 00:00-09:00) 每 30 分鐘
    # 避開 UTC 00:00 和 12:00 整點，與 update-data.yml 錯開
    - cron: '30 0-8 * * *'
    # 夜間低頻：台灣 17:00-08:00 (UTC 09:00-00:00) 每 2 小時
    - cron: '0 9,11,13,15,17,19,21,23 * * *'
  workflow_dispatch:  # 允許手動觸發

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  update-ais:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pysocks

      - name: Restore large data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/vessel_profiles.json
            data/ais_track_commercial.json
          key: large-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            large-data-${{ runner.os }}-

      - name: Fetch AIS data via SOCKS5 proxy
        run: python src/fetch_ais_data.py
        env:
          USE_PROXY: "true"
          POOL: ${{ secrets.POOL }}
        continue-on-error: true

      - name: Analyze suspicious vessels (CSIS methodology)
        run: python src/analyze_suspicious.py
        continue-on-error: true

      - name: Extract all vessel routes
        run: python src/extract_all_routes.py
        continue-on-error: true

      - name: Detect ship-to-ship transfers
        run: python src/detect_ship_transfers.py
        continue-on-error: true

      - name: Generate dashboard data
        run: python src/generate_dashboard.py

      - name: Save large data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/vessel_profiles.json
            data/ais_track_commercial.json
          key: large-data-${{ runner.os }}-${{ github.run_id }}

      # 驗證關鍵輸出檔；失敗的檔案以 --restore 還原上次好版本再 commit，
      # 並於最後一步讓整個 job 顯示失敗（取代原 inline VESSEL_COUNT 守衛）
      - name: Validate pipeline outputs
        id: validate
        run: python src/validate_outputs.py --restore
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "📡 AIS update $(date +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X theirs origin main || {
            echo "⚠️ Rebase 失敗，改用 merge 策略"
            git rebase --abort
            git pull -X ours origin main
          }
          git push

      # 永久歸檔：主檔 append-and-trim（14/28 天）會丟棄舊 snapshot。此步把 fetch 腳本
      # 寫出的本輪 delta（單行 JSONL）append 進 ais-archive 分支的月度檔，累積全部歷史，
      # 供離線（本機）航跡預測模型訓練。與 vessel-data 不同：這裡是一般 push（累積），
      # 不可 force。ais-archive 不進 Pages artifact；月度檔下載完可自行從分支刪除。
      - name: Append snapshot to ais-archive branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -f data/track_delta.jsonl ] || { echo "無 delta，跳過"; exit 0; }
          MONTH=$(date -u +%Y-%m)
          TMP=$(mktemp -d)
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # 淺 clone 既有分支；不存在則初始化一個新的 orphan 分支
          if ! git clone --depth 1 --branch ais-archive "$URL" "$TMP" 2>/dev/null; then
            git init -q -b ais-archive "$TMP"
            git -C "$TMP" remote add origin "$URL"
          fi
          mkdir -p "$TMP/archive"
          cat data/track_delta.jsonl >> "$TMP/archive/ais_track_${MONTH}.jsonl"
          [ -f data/track_commercial_delta.jsonl ] && \
            cat data/track_commercial_delta.jsonl >> "$TMP/archive/ais_commercial_${MONTH}.jsonl" || true
          git -C "$TMP" config user.email "action@github.com"
          git -C "$TMP" config user.name "GitHub Action"
          git -C "$TMP" add archive/
          git -C "$TMP" commit -qm "archive snapshot $(date -u +'%Y-%m-%d %H:%M') UTC" || { echo "無變更"; exit 0; }
          git -C "$TMP" push origin ais-archive

      # 航跡檔不進 main（27k 檔的歷史讓 repo 膨脹到 200MB+），
      # 每輪以單一 commit force push 到 vessel-data 分支（歷史永遠只有一版）。
      # 前端在 GitHub Pages 上經 raw.githubusercontent.com/.../vessel-data/ 讀取。
      - name: Push vessel routes to vessel-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ ! -d data/vessel_routes ] || [ -z "$(ls -A data/vessel_routes 2>/dev/null)" ]; then
            echo "data/vessel_routes 不存在或為空，跳過"
            exit 0
          fi
          TMP=$(mktemp -d)
          mkdir -p "$TMP/data"
          cp -r data/vessel_routes "$TMP/data/"
          cd "$TMP"
          git init -q -b vessel-data
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -qm "vessel routes snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" vessel-data

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::管線輸出驗證失敗 — 詳見 Validate pipeline outputs 步驟。壞檔已還原為上次好版本後才 commit。"
          exit 1

      # 不再自帶 deploy job：push 到 main 會觸發內建的 pages-build-deployment。
      # 先前兩條部署路徑（內建 + 自訂 deploy-pages）互搶，導致
      # "Deployment request failed ... due to in progress deployment" 連鎖失敗。
