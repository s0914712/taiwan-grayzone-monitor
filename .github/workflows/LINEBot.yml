name: LINE Bot Daily Report

on:
  schedule:
    # GitHub cron 使用 UTC 時間。
    # 台灣時間 (UTC+8) 每天早上 08:00 推送 → UTC 00:00。
    # 格式：分 時 日 月 星期
    - cron: '0 0 * * *'

  # 允許在 GitHub 網頁上手動觸發測試，不用等排程
  workflow_dispatch:

jobs:
  push-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 產生並推送每日報告
        env:
          # 將 Secrets 轉成腳本讀取的環境變數
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # LLM 產文用（選填）；未設定時自動退回固定模板
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/SendMessage.py
